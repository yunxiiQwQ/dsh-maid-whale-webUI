# deepseek-workshop skin bundle patch: inserts its dsh.client row into the web
# plugin roster and seeds the desktop companion's default settings.
- insert:
    - id: ui-skin-maid-whale-webui
      name: '@dsh-external/dsh-client-ui-skin-maid-whale-webui'
      config:
        enabled: true
        scale: 0.65
        bubbleScale: 1
        activityLevel: normal
        reducedMotion: false
        bubbleMode: always
        bubbleStates:
          - SUCCESS
          - ERROR
          - WAITING
        includeSubagents: false
